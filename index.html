<!DOCTYPE html>
<html>
<head>
    <title>System Update</title>
    <style>
        body {
            background: #2D2D2D;
            color: #00FF00;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 28px; /* Bigger base font */
        }
        .terminal-header {
            font-size: 36px; /* Larger header */
            margin-bottom: 30px;
            color: #FF6B00;
            font-weight: bold;
        }
        .progress-container {
            width: 80%;
            background: #1A1A1A;
            border: 3px solid #00FF00; /* Thicker border */
            border-radius: 5px;
            margin: 30px 0;
        }
        .progress-bar {
            width: 0%;
            height: 40px; /* Thicker bar */
            background: #FF6B00;
            transition: width 0.5s ease;
        }
        .percentage {
            font-size: 32px; /* Larger percentage */
            margin: 15px 0;
            font-weight: bold;
        }
        .status {
            font-size: 24px; /* Bigger status text */
            margin: 15px 0;
            min-height: 30px;
            font-weight: bold;
        }
        .blink {
            animation: blink 1s infinite;
            font-size: 30px;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="terminal-header">HusbandOS v2.5 Update</div>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="percentage" id="percentage">5% complete</div>
    <div class="status" id="status">Initializing night owl protocol...</div>
    <div class="status">█<span class="blink">_</span></div>

    <script>
        let progress = 5;
        const progressBar = document.getElementById('progressBar');
        const percentage = document.getElementById('percentage');
        const status = document.getElementById('status');
        
        const messages = [
            "Optimizing 2AM gaming session endurance",
            "Calibrating 'one more level' tolerance",
            "Downloading midnight snack navigation system",
            "Installing caffeine metabolism upgrade",
            "Patch: Extended 'just 5 more minutes' to 3 hours",
            "Optimizing dark mode eye comfort settings",
            "Updating late-night controller reflexes",
            "Installing anti-early-bedtime firewall (reinforced)",
            "Calibrating snore volume for optimal sleep avoidance",
            "Optimizing couch-to-bed migration algorithm",
            "Installing 'yawning is just stretching' module",
            "Patch: Fixed 'I'm not tired' detection system"
        ];
        
        const update = setInterval(() => {
            progress += Math.floor(Math.random() * 4) + 1;
            if (progress > 100) progress = 100;
            
            progressBar.style.width = progress + '%';
            percentage.textContent = progress + '% complete';
            
            if (progress % 8 === 0) {
                status.textContent = messages[Math.floor(Math.random() * messages.length)];
            }
            
            if (progress >= 100) {
                clearInterval(update);
                setTimeout(() => {
                    status.textContent = "UPDATE COMPLETE: Still the best husband! 💕";
                    status.style.color = "#FF6B00";
                    progressBar.style.background = '#00FF00';
                }, 1000);
            }
        }, 700);
    </script>
</body>
</html>
