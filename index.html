<!DOCTYPE html>
<html>
<head>
    <title>System Update</title>
    <style>
        body {
            background: #2D2D2D;
            color: #00FF00;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 30px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .terminal-header {
            font-size: 48px;
            margin-bottom: 40px;
            color: #FF6B00;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .progress-container {
            width: 90%;
            background: #1A1A1A;
            border: 4px solid #00FF00;
            border-radius: 8px;
            margin: 40px 0;
        }
        .progress-bar {
            width: 0%;
            height: 50px;
            background: #FF6B00;
            transition: width 0.5s ease;
        }
        .percentage {
            font-size: 42px;
            margin: 25px 0;
            font-weight: bold;
            color: #FFFFFF;
        }
        .status {
            font-size: 32px;
            margin: 25px 0;
            min-height: 40px;
            font-weight: bold;
            line-height: 1.3;
            transition: opacity 0.5s ease;
        }
        .blink {
            animation: blink 1s infinite;
            font-size: 36px;
        }
        .high-contrast {
            text-shadow: 0 0 10px #00FF00, 0 0 20px #00FF00;
        }
        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="terminal-header high-contrast">HusbandOS v2.5 Update</div>
    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="percentage high-contrast" id="percentage">5% complete</div>
    <div class="status high-contrast" id="status">Initializing night owl protocol...</div>
    <div class="status">█<span class="blink">_</span></div>
    
<script>
        let progress = 5;
        const progressBar = document.getElementById('progressBar');
        const percentage = document.getElementById('percentage');
        const status = document.getElementById('status');
        
        const messages = [
            "Optimizing 2AM gaming session endurance",
            "Calibrating 'one more level' tolerance",
            "Downloading midnight snack navigation system",
            "Installing caffeine metabolism upgrade",
            "Patch: Extended 'just 5 more minutes' to 3 hours",
            "Optimizing dark mode eye comfort settings",
            "Updating late-night controller reflexes",
            "Installing anti-early-bedtime firewall (reinforced)",
            "Calibrating snore volume for optimal sleep avoidance",
            "Optimizing couch-to-bed migration algorithm",
            "Installing 'yawning is just stretching' module",
            "Patch: Fixed 'I'm not tired' detection system",
            "Loading extended cutscene skip functionality",
            "Optimizing controller battery conservation",
            "Installing automatic snack refill detection",
            "Updating 'I was just resting my eyes' protocol",
            "Calibrating perfect couch recline angles",
            "Installing game achievement tracker v2.0"
        ];
        
        // Track current message and timing
        let currentMessageIndex = 0;
        let messageStartTime = 0;
        const minMessageDuration = 5000; // 5 seconds minimum per message
        const maxMessageDuration = 8000; // 8 seconds maximum per message
        
        function updateStatus() {
            const now = Date.now();
            
            // Only change message if enough time has passed
            if (now - messageStartTime > minMessageDuration) {
                // For longer messages, wait even longer
                const currentMessage = messages[currentMessageIndex];
                const messageLengthFactor = Math.max(1, currentMessage.length / 30);
                const requiredDuration = minMessageDuration * messageLengthFactor;
                
                if (now - messageStartTime > requiredDuration) {
                    currentMessageIndex = (currentMessageIndex + 1) % messages.length;
                    status.style.opacity = '0';
                    
                    setTimeout(() => {
                        status.textContent = messages[currentMessageIndex];
                        status.style.opacity = '1';
                        messageStartTime = Date.now();
                    }, 500); // Fade out/in duration
                }
            }
        }
        
        const update = setInterval(() => {
            progress += Math.floor(Math.random() * 2) + 1; // Slower progress
            if (progress > 100) progress = 100;
            
            progressBar.style.width = progress + '%';
            percentage.textContent = progress + '% complete';
            
            // Update status message timing
            updateStatus();
            
            if (progress >= 100) {
                clearInterval(update);
                setTimeout(() => {
                    status.textContent = "UPDATE COMPLETE: Still the best husband! 💕";
                    status.style.color = "#FF6B00";
                    progressBar.style.background = '#00FF00';
                }, 1000);
            }
        }, 1200); // Much slower progress (1200ms = 1.2 seconds per update)
        
        // Initialize first message
        messageStartTime = Date.now();
</script>
</body>
</html>
